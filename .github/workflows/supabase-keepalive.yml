name: Supabase Keep-Alive

on:
  schedule:
    # Запуск двічі на день (о 06:00 та 18:00 UTC) для гарантованої щоденної активності
    - cron: '0 6,18 * * *'
  workflow_dispatch: # Дозволяє ручний запуск в один клік у GitHub Actions

jobs:
  keep-alive:
    name: Ping Supabase Database
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive query to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.PUBLIC_SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY || secrets.SUPABASE_KEY || secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::Необхідні змінні SUPABASE_URL або SUPABASE_KEY не знайдено в GitHub Secrets!"
            exit 1
          fi

          echo "1. Виконується POST-запит до RPC search_companies (примусове виконання SQL у PostgreSQL)..."
          RPC_STATUS=$(curl -fsS -w "%{http_code}" -o /tmp/rpc_out.json \
            -X POST "${SUPABASE_URL}/rest/v1/rpc/search_companies" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"search_query": "32673400", "lim": 1}' || echo "FAILED")

          if [ "$RPC_STATUS" = "200" ]; then
            cat /tmp/rpc_out.json
            echo -e "\n✓ RPC search_companies успішно виконано (HTTP 200). Транзакція в Postgres зареєстрована."
          else
            echo "RPC повернув статус $RPC_STATUS, виконання fallback GET-запиту..."
            curl -fsS -w "\nHTTP_STATUS:%{http_code}\nTIME_TOTAL:%{time_total}s\n" \
              -X GET "${SUPABASE_URL}/rest/v1/companies?select=edrpou&limit=1" \
              -H "apikey: ${SUPABASE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_KEY}"
            echo "✓ Fallback GET-запит успішний."
          fi
