<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <!-- Background & Glowing Gradients -->
    <linearGradient id="og-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080A10" />
      <stop offset="50%" stop-color="#05070B" />
      <stop offset="100%" stop-color="#020305" />
    </linearGradient>
    <radialGradient id="og-glow-1" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="og-glow-2" cx="85%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>

    <!-- Badge Gradients -->
    <linearGradient id="badge-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121826" />
      <stop offset="100%" stop-color="#0A0E17" />
    </linearGradient>
    <linearGradient id="badge-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="og-brand-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
    <linearGradient id="og-hryvnia-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="50%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Pattern -->
    <pattern id="og-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.02" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#og-bg)" />
  <rect width="1200" height="630" fill="url(#og-grid)" />
  <rect width="1200" height="630" fill="url(#og-glow-1)" />
  <rect width="1200" height="630" fill="url(#og-glow-2)" />

  <!-- Outer Ambient Border -->
  <rect x="24" y="24" width="1152" height="582" rx="28" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1.5" />

  <!-- Content Container -->
  <g transform="translate(100, 100)">
    <!-- Top Pill Badge -->
    <g transform="translate(0, 0)">
      <rect width="250" height="38" rx="19" fill="#10B981" fill-opacity="0.1" stroke="#34D399" stroke-opacity="0.3" stroke-width="1" />
      <circle cx="20" cy="19" r="4.5" fill="#34D399" />
      <text x="36" y="24" font-family="'Geist Mono', monospace" font-size="13" font-weight="600" fill="#34D399" letter-spacing="1">
        DATA.GOV.UA · 2025
      </text>
    </g>

    <!-- Logo & Title Section -->
    <g transform="translate(0, 70)">
      <!-- Large Brand Icon (96x96) -->
      <g transform="translate(0, 0)">
        <rect width="96" height="96" rx="26" fill="url(#badge-bg)" stroke="url(#badge-border)" stroke-width="2.5" />
        <circle cx="48" cy="48" r="28" fill="#10B981" opacity="0.16" />
        <circle cx="74" cy="22" r="4.5" fill="#38BDF8" />

        <!-- Stylized ₴ -->
        <g transform="translate(48, 50) scale(1.5)">
          <path 
            d="M 6 -15 C 3 -18 -4 -18 -8 -15 C -12 -12 -12 -6 -8 -3 C -3 0 6 3 9 7 C 13 11 13 18 8 22 C 3 25 -5 25 -10 21 C -12 19 -13 17 -14 14" 
            fill="none" 
            stroke="url(#og-hryvnia-accent)" 
            stroke-width="4.5" 
            stroke-linecap="round" 
            stroke-linejoin="round"
          />
          <line x1="-15" y1="-3" x2="15" y2="-3" stroke="url(#og-brand-accent)" stroke-width="3.5" stroke-linecap="round" />
          <line x1="-15" y1="5" x2="15" y2="5" stroke="url(#og-brand-accent)" stroke-width="3.5" stroke-linecap="round" />
        </g>
      </g>

      <!-- Site Brand Name -->
      <g transform="translate(120, 72)">
        <text font-family="system-ui, -apple-system, 'Inter', sans-serif" font-size="64" font-weight="900" letter-spacing="-1.5">
          <tspan fill="#FFFFFF">Fin</tspan>
          <tspan fill="url(#og-brand-accent)">Zvit</tspan>
        </text>
      </g>
    </g>

    <!-- Headline -->
    <g transform="translate(0, 220)">
      <text font-family="system-ui, -apple-system, 'Inter', sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
        Відкрита фінансова звітність України
      </text>
    </g>

    <!-- Subtitle / Value Proposition -->
    <g transform="translate(0, 275)">
      <text font-family="system-ui, -apple-system, 'Inter', sans-serif" font-size="22" font-weight="400" fill="#94A3B8" line-height="34">
        Баланс (Ф1), фінрезультати (Ф2), рух грошових коштів (Ф3) та показники KPI
      </text>
      <text y="36" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-size="22" font-weight="400" fill="#64748B">
        Офіційні форми держстатистики за 300,000+ українських підприємств
      </text>
    </g>

    <!-- Badges Row -->
    <g transform="translate(0, 385)">
      <!-- Badge 1: Форми -->
      <rect width="180" height="42" rx="12" fill="#181F2E" stroke="#334155" stroke-width="1" />
      <text x="90" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#E2E8F0">
        📊 Форми № 1, 2, 3, 4, 5
      </text>

      <!-- Badge 2: НП(С)БО & МСФЗ -->
      <g transform="translate(196, 0)">
        <rect width="170" height="42" rx="12" fill="#181F2E" stroke="#334155" stroke-width="1" />
        <text x="85" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#E2E8F0">
          ⚖️ НП(С)БО та МСФЗ
        </text>
      </g>

      <!-- Badge 3: Аналітика -->
      <g transform="translate(382, 0)">
        <rect width="180" height="42" rx="12" fill="#181F2E" stroke="#334155" stroke-width="1" />
        <text x="90" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#E2E8F0">
          ⚡ Миттєвий розрахунок
        </text>
      </g>

      <!-- Badge 4: ДПС & Держстат -->
      <g transform="translate(578, 0)">
        <rect width="210" height="42" rx="12" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-opacity="0.3" stroke-width="1" />
        <text x="105" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#34D399">
          🇺🇦 Реєстри ДПС / ДССУ
        </text>
      </g>
    </g>
  </g>
</svg>
