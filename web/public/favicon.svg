<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F141F"/>
      <stop offset="100%" stop-color="#06080C"/>
    </linearGradient>
    <linearGradient id="fav-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <!-- Background Squircle with emerald border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#fav-bg)" stroke="url(#fav-border)" stroke-width="2"/>
  <!-- Ambient Center Glow -->
  <circle cx="32" cy="33" r="15" fill="#10B981" opacity="0.14"/>
  <!-- Official Ukrainian Hryvnia Symbol (₴) -->
  <text x="32" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Text', Roboto, sans-serif" font-size="34" font-weight="bold" fill="#34D399" text-anchor="middle">₴</text>
</svg>
