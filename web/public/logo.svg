<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64" fill="none">
  <defs>
    <linearGradient id="logo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F141F"/>
      <stop offset="100%" stop-color="#06080C"/>
    </linearGradient>
    <linearGradient id="logo-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Left Icon Badge (48x48) -->
  <g transform="translate(8, 8)">
    <rect width="48" height="48" rx="14" fill="url(#logo-bg)" stroke="url(#logo-border)" stroke-width="1.8"/>
    <circle cx="24" cy="24" r="12" fill="#10B981" opacity="0.15"/>
    <text x="24" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif" font-size="28" font-weight="bold" fill="#34D399" text-anchor="middle">₴</text>
  </g>

  <!-- Typography: FinZvit -->
  <text x="68" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">Fin</text>
  <text x="112" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="28" font-weight="900" fill="#34D399" letter-spacing="-0.5">Zvit</text>

  <!-- Subtitle -->
  <text x="69" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Geist Mono', monospace" font-size="7.5" font-weight="600" fill="#71717A" letter-spacing="1.5">
    ВІДКРИТА ФІНАНСОВА ЗВІТНІСТЬ
  </text>
</svg>
