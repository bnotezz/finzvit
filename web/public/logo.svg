<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <defs>
    <linearGradient id="logo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E131F" />
      <stop offset="100%" stop-color="#05070B" />
    </linearGradient>
    <linearGradient id="logo-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="logo-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="50%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="logo-text-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
    <linearGradient id="logo-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>

  <!-- Icon Badge (48x48) -->
  <g transform="translate(8, 8)">
    <rect x="0" y="0" width="48" height="48" rx="14" fill="url(#logo-bg)" stroke="url(#logo-border)" stroke-width="1.75" />
    <circle cx="24" cy="24" r="14" fill="#10B981" opacity="0.15" />
    <!-- Indicator dot -->
    <circle cx="37" cy="11" r="2.5" fill="#38BDF8" />

    <!-- Stylized ₴ -->
    <g transform="translate(24, 25) scale(0.78)">
      <path 
        d="M 6 -15 C 3 -18 -4 -18 -8 -15 C -12 -12 -12 -6 -8 -3 C -3 0 6 3 9 7 C 13 11 13 18 8 22 C 3 25 -5 25 -10 21 C -12 19 -13 17 -14 14" 
        fill="none" 
        stroke="url(#logo-accent)" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
      />
      <line x1="-15" y1="-3" x2="15" y2="-3" stroke="url(#logo-bar)" stroke-width="3.5" stroke-linecap="round" />
      <line x1="-15" y1="5" x2="15" y2="5" stroke="url(#logo-bar)" stroke-width="3.5" stroke-linecap="round" />
    </g>
  </g>

  <!-- Typography -->
  <g transform="translate(68, 38)">
    <text font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" letter-spacing="-0.5">
      <tspan fill="#FFFFFF">Fin</tspan>
      <tspan fill="url(#logo-text-accent)">Zvit</tspan>
    </text>
  </g>

  <!-- Subtitle Tag -->
  <g transform="translate(69, 52)">
    <text font-family="'Geist Mono', 'SF Mono', Consolas, monospace" font-size="7.5" font-weight="600" fill="#71717A" letter-spacing="1.5">
      ВІДКРИТІ ФІНАНСИ УКРАЇНИ
    </text>
  </g>
</svg>
